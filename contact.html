<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="contact-page">
      <a href="index.html" class="home-link" aria-label="Home">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path
            d="M5 20 L24 5 L43 20 M10 17 V43 H21 V29 H29 V43 H39 V17"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M8 13 V8 H14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
        </svg>
      </a>

      <div class="decor decor-left"></div>
      <div class="decor decor-bottom"></div>
      <div class="decor decor-right"></div>

      <section class="contact-content">
        <header class="contact-header">
          <h1>Contact Us</h1>
          <p>
            Aenean sit amet magna vel magna fringilla fermentum. Donec sit amet
            nulla sed arcu pulvinar ultricies commodo id ligula.
          </p>
        </header>

        <form class="contact-form">
          <div class="form-field">
            <input type="text" id="name" name="name" placeholder=" " required />
            <label for="name">What is your name? *</label>
          </div>

          <div class="form-field email-field">
            <input
              type="email"
              id="email"
              name="email"
              placeholder=" "
              required
            />
            <label for="email">What it your email? *</label>
          </div>

          <div class="form-field phone-field">
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+12 345 678 90"
            />
            <label for="phone">What is your phone number?</label>
          </div>

          <div class="form-field company-field">
            <input type="text" id="company" name="company" placeholder=" " />
            <label for="company">What is your company?</label>
          </div>

          <div class="form-field message-field">
            <textarea
              id="message"
              name="message"
              placeholder="Write your message here"
              required
            ></textarea>
          </div>

          <div class="form-bottom">
            <label class="terms">
              <input type="checkbox" required checked />
              <span>
                I have read and accept the Terms of
                <a href="#privacy">Service &amp; Privacy Policy *</a>
              </span>
            </label>

            <button type="submit" class="submit-button">SEND MESSAGE</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
